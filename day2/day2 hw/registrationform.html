<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>

    <div class="registration-container">
        <h1>Registration Form</h1>
        
        <div class="b">
            <form>
                <div class="form-left">
                    <div class="input-group">
                        <label>User Name:</label>
                        <input type="text" name="username">
                    </div>

                    <div class="input-group">
                        <label>Email:</label>
                        <input type="email" name="email">
                    </div>

                    <div class="input-group">
                        <label>Phone Number:</label>
                        <input type="tel" name="phone">
                    </div>

                    <div class="input-group">
                        <label>Password:</label>
                        <input type="password" name="password">
                    </div>

                    <div class="input-group">
                        <label>Re-enter Password:</label>
                        <input type="password" name="repassword">
                    </div>

                    <div class="input-group">
                        <label>Gender:</label>
                        <select>
                            <option>Select</option>
                            <option>Male</option>
                            <option>Female</option>
                        </select>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="show-pass">
                        <label for="show-pass">Show Password</label>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn-register">Register</button>
                        <button type="reset" class="btn-reset">Reset</button>
                    </div>
                </div>

                <div class="image-right">
                    <img src="https://encrypted-tbn1.gstatic.com/shopping?q=tbn:ANd9GcQlQEIRjzAsxhiCwVucsCNPDBZ7ULAgncdB9jYyzz07DLSCml5SOLug5UVUojIYtF_UJJC7e2Pni8ehIgHoQJqmdxlzh5LlsjA8cI5w77cN0J-OEk_ml27f" alt="Registration Illustration"></img>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
